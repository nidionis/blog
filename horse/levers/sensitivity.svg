<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" role="img" aria-label="Practical 2 hp chamber diameters for each lever">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="190.0" y="28.0" font-family="sans-serif" font-size="17" font-weight="bold" fill="#111111" text-anchor="start">2 hp chamber: what each lever buys</text>
<text x="190.0" y="47.0" font-family="sans-serif" font-size="11" font-weight="normal" fill="#555555" text-anchor="start">One lever at a time; dashed line = 55.7 cm baseline. D = L convention.</text>
<text x="190.0" y="64.0" font-family="sans-serif" font-size="11" font-weight="normal" fill="#555555" text-anchor="start">Cube-root law: 4× more power only halves the diameter, but mass falls with the cube.</text>
