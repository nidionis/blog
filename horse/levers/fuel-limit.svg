<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" role="img" aria-label="Fuel-limited mechanical power versus efficiency">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="70.0" y="28.0" font-family="sans-serif" font-size="17" font-weight="bold" fill="#111111" text-anchor="start">Fuel cap: 30 kg / 20 min × 12 MJ/kg = 300 kW thermal</text>
<text x="70.0" y="47.0" font-family="sans-serif" font-size="11" font-weight="normal" fill="#555555" text-anchor="start">Mechanical cap = efficiency × 300 kW. At the 5 % baseline it is 15 kW ≈ 20.4 hp.</text>
<line x1="70.0" y1="350.0" x2="790.0" y2="350.0" stroke="#e5e5e5" stroke-width="1"/>
<text x="62.0" y="354.0" font-family="sans-serif" font-size="11" font-weight="normal" fill="#555555" text-anchor="end">0</text>
<line x1="70.0" y1="305.4" x2="790.0" y2="305.4" stroke="#e5e5e5" stroke-width="1"/>
<text x="62.0" y="309.4" font-family="sans-serif" font-size="11" font-weight="normal" fill="#555555" text-anchor="end">10</text>
<line x1="70.0" y1="260.8" x2="790.0" y2="260.8" stroke="#e5e5e5" stroke-width="1"/>
<text x="62.0" y="264.8" font-family="sans-serif" font-size="11" font-weight="normal" fill="#555555" text-anchor="end">20</text>
<line x1="70.0" y1="216.2" x2="790.0" y2="216.2" stroke="#e5e5e5" stroke-width="1"/>
<text x="62.0" y="220.2" font-family="sans-serif" font-size="11" font-weight="normal" fill="#555555" text-anchor="end">30</text>
<line x1="70.0" y1="171.5" x2="790.0" y2="171.5" stroke="#e5e5e5" stroke-width="1"/>
<text x="62.0" y="175.5" font-family="sans-serif" font-size="11" font-weight="normal" fill="#555555" text-anchor="end">40</text>
<line x1="70.0" y1="126.9" x2="790.0" y2="126.9" stroke="#e5e5e5" stroke-width="1"/>
<text x="62.0" y="130.9" font-family="sans-serif" font-size="11" font-weight="normal" fill="#555555" text-anchor="end">50</text>
<line x1="70.0" y1="82.3" x2="790.0" y2="82.3" stroke="#e5e5e5" stroke-width="1"/>
<text x="62.0" y="86.3" font-family="sans-serif" font-size="11" font-weight="normal" fill="#555555" text-anchor="end">60</text>
<line x1="70.0" y1="350.0" x2="790.0" y2="350.0" stroke="#333333" stroke-width="1.2"/>
<line x1="70.0" y1="60.0" x2="70.0" y2="350.0" stroke="#333333" stroke-width="1.2"/>
<text x="18.0" y="205.0" font-family="sans-serif" font-size="12" font-weight="normal" fill="#111111" text-anchor="middle" transform="rotate(-90 18 205.0)">mechanical cap (kW)</text>
<rect x="110.5" y="283.1" width="99.0" height="66.9" fill="#2ca02c" opacity="0.85"/>
<text x="160.0" y="275.1" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111" text-anchor="middle">15 kW</text>
<text x="160.0" y="370.0" font-family="sans-serif" font-size="12" font-weight="normal" fill="#111111" text-anchor="middle">5 %</text>
<text x="160.0" y="387.0" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#555555" text-anchor="middle">20 hp</text>
<rect x="290.5" y="216.2" width="99.0" height="133.8" fill="#2ca02c" opacity="0.85"/>
<text x="340.0" y="208.2" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111" text-anchor="middle">30 kW</text>
<text x="340.0" y="370.0" font-family="sans-serif" font-size="12" font-weight="normal" fill="#111111" text-anchor="middle">10 %</text>
<text x="340.0" y="387.0" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#555555" text-anchor="middle">41 hp</text>
<rect x="470.5" y="149.2" width="99.0" height="200.8" fill="#2ca02c" opacity="0.85"/>
<text x="520.0" y="141.2" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111" text-anchor="middle">45 kW</text>
<text x="520.0" y="370.0" font-family="sans-serif" font-size="12" font-weight="normal" fill="#111111" text-anchor="middle">15 %</text>
<text x="520.0" y="387.0" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#555555" text-anchor="middle">61 hp</text>
<rect x="650.5" y="82.3" width="99.0" height="267.7" fill="#2ca02c" opacity="0.85"/>
<text x="700.0" y="74.3" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111111" text-anchor="middle">60 kW</text>
<text x="700.0" y="370.0" font-family="sans-serif" font-size="12" font-weight="normal" fill="#111111" text-anchor="middle">20 %</text>
<text x="700.0" y="387.0" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#555555" text-anchor="middle">82 hp</text>
<line x1="70.0" y1="284.4" x2="790.0" y2="284.4" stroke="#555555" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="430.0" y="400.0" font-family="sans-serif" font-size="12" font-weight="normal" fill="#111111" text-anchor="middle">overall efficiency</text>
</svg>